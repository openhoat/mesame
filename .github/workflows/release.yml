# Release Pipeline - Build and publish Electron app to GitHub Releases
name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Setup Node.js Environment
        uses: ./.github/actions/node-setup

      - name: Install Dependencies
        uses: ./.github/actions/install-deps
        with:
          generate-prisma: 'true'

      - name: Build project
        run: npm run build:all

      - name: Build Linux package
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish never

      - name: Build macOS package
        if: runner.os == 'macOS'
        run: npx electron-builder --mac --publish never

      - name: Build Windows package
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish never

      - name: Upload Linux artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: dist-electron-app/*.AppImage
          retention-days: 30

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: dist-electron-app/*.dmg
          retention-days: 30

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: dist-electron-app/*.exe
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux-release/*.AppImage
            artifacts/macos-release/*.dmg
            artifacts/windows-release/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false