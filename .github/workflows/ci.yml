# Continuous Integration Pipeline
# Optimized: npm cache shared across jobs, no artifact sharing issues
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js with npm cache
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Cache Wireit
        uses: actions/cache@v5
        with:
          path: .wireit
          key: ${{ runner.os }}-wireit-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-wireit-

      - name: Install dependencies
        run: npm ci

      - name: Validate (lint + typecheck + test with coverage)
        run: npm run validate

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js with npm cache
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Cache Wireit
        uses: actions/cache@v5
        with:
          path: .wireit
          key: ${{ runner.os }}-wireit-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-wireit-

      - name: Install dependencies
        run: npm ci

      - name: Build all
        run: npm run build:all

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-artifacts
          path: dist
          retention-days: 1
          if-no-files-found: error

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [validate, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js with npm cache
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Cache Wireit
        uses: actions/cache@v5
        with:
          path: .wireit
          key: ${{ runner.os }}-wireit-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-wireit-

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-artifacts
          path: dist

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Initialize database
        run: npm run db:push
        env:
          DATABASE_URL: file:./test.db

      - name: Seed database
        run: npm run db:seed
        env:
          DATABASE_URL: file:./test.db

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          DATABASE_URL: file:./test.db
          MESAME_LOG_LEVEL: silent
          CI: true

      - name: Upload E2E test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-test-results
          path: |
            dist/e2e-report/
            dist/test-results/
          retention-days: 7
          if-no-files-found: ignore