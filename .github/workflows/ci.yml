# Continuous Integration Pipeline
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: .npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Validate (lint + typecheck + test with coverage)
        run: npm run validate

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: .npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build all
        run: npm run build:all

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: .npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build all
        run: npm run build:all

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run E2E tests
        run: xvfb-run -a npm run test:e2e:headless
        env:
          MESAME_LOG_LEVEL: silent

      - name: Upload E2E test results
        uses: actions/upload-artifact@v8
        if: always()
        with:
          name: e2e-test-results
          path: |
            e2e-report/
            test-results/
          retention-days: 7

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [validate, build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: .npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Setup display for Electron
        uses: pyTooling/Actions/retry@v0.5.0
        with:
          action: setup-xvfb@v1
          arguments: |
            xvfb-run npm run test:e2e
          attempts: 1

      - name: Build Electron app
        run: npm run build:all

      - name: Run E2E tests headless
        run: xvfb-run -a npm run test:e2e:headless
        env:
          CI: true

      - name: Upload E2E test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-test-results
          path: |
            e2e-report/
            test-results/
          retention-days: 7

