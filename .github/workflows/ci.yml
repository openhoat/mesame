# Continuous Integration Pipeline
# Optimized: npm cache shared across jobs, no artifact sharing issues
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Cache Wireit
        uses: actions/cache@v5
        with:
          path: .wireit
          key: ${{ runner.os }}-wireit-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-wireit-

      - name: Install dependencies
        run: npm ci

      - name: Validate (lint + typecheck + test with coverage)
        run: npm run validate

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js with npm cache
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Cache Wireit
        uses: actions/cache@v5
        with:
          path: .wireit
          key: ${{ runner.os }}-wireit-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-wireit-

      - name: Install dependencies
        run: npm ci

      - name: Build all
        run: npm run build:all

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-artifacts
          path: dist
          retention-days: 1
          if-no-files-found: error