<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>MeSame - Your Personal Style Proxy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      text-align: center;
      padding: 2rem;
      max-width: 600px;
    }

    .logo {
      width: 128px;
      height: 128px;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      padding: 1rem 2rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .status-dot.running {
      background: #22c55e;
    }

    .status-dot.stopped {
      background: #ef4444;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .info-card {
      padding: 1rem;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .info-card h3 {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 0.25rem;
    }

    .info-card p {
      font-size: 1.25rem;
      font-weight: 600;
    }

    .actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.2);
      text-align: center;
      font-size: 0.875rem;
      color: #64748b;
    }

    .version {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="../assets/MeSame_icon.png" alt="MeSame Logo" class="logo" onerror="this.style.display='none'">

    <h1>MeSame</h1>
    <p class="tagline">Your Personal Style Proxy</p>

    <div class="status">
      <span class="status-dot running" id="status-dot"></span>
      <span id="status-text">Server Running</span>
    </div>

    <div class="info">
      <div class="info-card">
        <h3>Proxy URL</h3>
        <p id="proxy-url">http://localhost:3000</p>
      </div>
      <div class="info-card">
        <h3>Provider</h3>
        <p id="provider">OpenAI</p>
      </div>
      <div class="info-card">
        <h3>Model</h3>
        <p id="model">gpt-4o</p>
      </div>
      <div class="info-card">
        <h3>Platform</h3>
        <p id="platform">Desktop</p>
      </div>
    </div>

    <div class="actions">
      <a href="http://localhost:3000/health" class="btn btn-secondary">API Health</a>
      <a href="https://github.com/openhoat/mesame" class="btn btn-secondary">GitHub</a>
    </div>
  </div>

  <div class="footer">
    <p>MeSame v<span class="version" id="version">0.1.0</span> - MIT License</p>
  </div>

  <script>
    // Update platform info if electron API is available
    if (window.electronAPI) {
      document.getElementById('platform').textContent =
        window.electronAPI.platform === 'darwin' ? 'macOS' :
        window.electronAPI.platform === 'win32' ? 'Windows' : 'Linux'

      window.electronAPI.getAppVersion().then(version => {
        document.getElementById('version').textContent = version
      })
    }
  </script>
</body>
</html>
