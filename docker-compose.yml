services:
  llm:
    build:
      context: .
      dockerfile: Dockerfile
    image: headwood.ddns.net:5000/mesame:latest
    container_name: mesame-llm
    restart: unless-stopped
    expose:
      - 3001
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - mesame-data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/mesame.db
      - MESAME_LLM_HOST=0.0.0.0
    networks:
      - infra_traefik
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["npm", "run", "start:llm"]
    labels:
      - traefik.enable=true
      - traefik.http.services.mesame-llm-svc.loadbalancer.server.port=3001
      - traefik.http.routers.mesame-llm-https.rule=Host(`${MESAME_LLM_VIRTUAL_HOST:-mesame-llm.localdomain}`)
      - traefik.http.routers.mesame-llm-https.entrypoints=websecure
      - traefik.http.routers.mesame-llm-https.tls=true
      - traefik.http.routers.mesame-llm-https.tls.certresolver=letsencrypt
      - traefik.http.routers.mesame-llm-https.service=mesame-llm-svc
      - traefik.http.routers.mesame-llm-http.rule=Host(`${MESAME_LLM_VIRTUAL_HOST:-mesame-llm.localdomain}`)
      - traefik.http.routers.mesame-llm-http.entrypoints=web
      - traefik.http.routers.mesame-llm-http.middlewares=redirect-web-secure@file

  web:
    image: headwood.ddns.net:5000/mesame:latest
    container_name: mesame-web
    restart: unless-stopped
    expose:
      - 3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - mesame-data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/mesame.db
      - MESAME_LLM_URL=http://llm:3001
      - MESAME_WEB_HOST=0.0.0.0
    depends_on:
      llm:
        condition: service_healthy
    networks:
      - infra_traefik
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["npm", "run", "start:web"]
    labels:
      - traefik.enable=true
      - traefik.http.services.mesame-web-svc.loadbalancer.server.port=3000
      - traefik.http.routers.mesame-web-https.rule=Host(`${MESAME_WEB_VIRTUAL_HOST:-mesame.localdomain}`)
      - traefik.http.routers.mesame-web-https.entrypoints=websecure
      - traefik.http.routers.mesame-web-https.tls=true
      - traefik.http.routers.mesame-web-https.tls.certresolver=letsencrypt
      - traefik.http.routers.mesame-web-https.service=mesame-web-svc
      - traefik.http.routers.mesame-web-http.rule=Host(`${MESAME_WEB_VIRTUAL_HOST:-mesame.localdomain}`)
      - traefik.http.routers.mesame-web-http.entrypoints=web
      - traefik.http.routers.mesame-web-http.middlewares=redirect-web-secure@file

volumes:
  mesame-data:
    driver: local

networks:
  infra_traefik:
    external: true
