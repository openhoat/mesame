services:
  llm:
    build:
      context: .
      dockerfile: Dockerfile
    image: headwood.ddns.net:5000/mesame-llm:latest
    container_name: mesame-llm
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - mesame-data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/mesame.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["npm", "run", "llm"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: headwood.ddns.net:5000/mesame-web:latest
    container_name: mesame-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - mesame-data:/app/data
    environment:
      - DATABASE_URL=file:/app/data/mesame.db
      - MESAME_LLM_URL=http://llm:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["npm", "run", "web"]
    depends_on:
      llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  mesame-data:
    driver: local